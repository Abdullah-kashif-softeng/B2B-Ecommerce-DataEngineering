# The main pipeline for bonze_to_silver

resources:
  pipelines:
    bonze_to_silver_etl:
      name: bonze_to_silver_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/bonze_to_silver_etl"

      libraries:
        - glob:
            include: ../src/bonze_to_silver_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
