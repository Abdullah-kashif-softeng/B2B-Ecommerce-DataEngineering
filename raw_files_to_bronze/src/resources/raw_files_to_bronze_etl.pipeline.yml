# The main pipeline for raw_files_to_bronze

resources:
  pipelines:
    raw_files_to_bronze_etl:
      name: raw_files_to_bronze_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/raw_files_to_bronze_etl"

      libraries:
        - glob:
            include: ../src/raw_files_to_bronze_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
          # Required by the bronze leads ingestion to parse the raw .xlsx files.
          - openpyxl
