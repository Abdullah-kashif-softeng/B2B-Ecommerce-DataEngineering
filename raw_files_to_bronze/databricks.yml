# This is a Declarative Automation Bundle definition for raw_files_to_bronze.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: raw_files_to_bronze
  uuid: 8cee6ad6-b2fa-4d06-8232-934f54b286bd

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-536b2d4e-b79b.cloud.databricks.com
    variables:
      catalog: b2b_ecommerce
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-536b2d4e-b79b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/seekhnaseekho66@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/seekhnaseekho66@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: b2b_ecommerce
      schema: prod
    permissions:
      - user_name: seekhnaseekho66@gmail.com
        level: CAN_MANAGE
